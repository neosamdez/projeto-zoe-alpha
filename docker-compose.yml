# Docker Compose da Cidadela ASI
# Orquestra: PostgreSQL · FastAPI · Next.js · Redis · Adminer

services:

  # ── API: FastAPI + Python ──────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoe_asi_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
    networks:
      - asi_network

  # ── DATABASE: PostgreSQL 16 ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zoe_asi_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-asi_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asi_network

  # ── REDIS: Cache Layer ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zoe_asi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - asi_network

  # ── ADMINER: Painel de Banco de Dados ──────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: zoe_asi_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - asi_network

  # ── FRONTEND: Next.js 16 — Dev Mode ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zoe_asi_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    networks:
      - asi_network

networks:
  asi_network:
    driver: bridge

volumes:
  postgres_data:
    name: zoe_asi_pgdata_persist
  redis_data:
    name: zoe_asi_redis_persist
